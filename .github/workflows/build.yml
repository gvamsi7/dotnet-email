name: SMTP API and email component checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-api:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sdk: '10.0.x'
            framework: net10.0
          - os: windows-latest
            sdk: '10.0.x'
            framework: net10.0
          - os: ubuntu-latest
            sdk: '11.0.x'
            framework: net11.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up API SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.sdk }}
          include-prerelease: true
      - name: Build runnable solution
        run: dotnet build DotnetEmail.sln --configuration Release -p:FeedbackTargetFramework=${{ matrix.framework }}
      - name: Publish runnable API
        run: dotnet publish source-code/ISH.CustomerPortal.API/ISH.CustomerPortal.API.csproj --configuration Release -p:FeedbackTargetFramework=${{ matrix.framework }} --output artifacts/api
      - name: Verify HTTP, users, attachments, validation, and rate limits
        if: runner.os == 'Windows'
        run: python verification/api_smoke_test.py --app artifacts/api/ISH.CustomerPortal.API.dll
      - name: Verify authenticated TLS SMTP delivery
        if: runner.os == 'Linux'
        run: python3 verification/api_smoke_test.py --app artifacts/api/ISH.CustomerPortal.API.dll --smtp

  aspnet-core-integration:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up verification SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify the layered email component
        run: dotnet run --project verification/SmokeTests/FeedbackEmail.SmokeTests.csproj --configuration Release
      - name: Publish the verification host with embedded template
        run: dotnet publish verification/SmokeTests/FeedbackEmail.SmokeTests.csproj --configuration Release --output artifacts/email-check
      - name: Verify the published component
        run: dotnet artifacts/email-check/FeedbackEmail.SmokeTests.dll

  legacy-net48:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/legacy-net48
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build legacy .NET Framework example
        run: dotnet build .\FeedbackEmail.csproj --configuration Release --nologo
      - name: Generate legacy previews without SMTP
        shell: pwsh
        run: |
          & .\bin\Release\net48\FeedbackEmail.exe --preview
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($file in @('feedback-preview.html', 'feedback-preview.eml')) {
            $path = Join-Path '.\bin\Release\net48\Preview' $file
            if (!(Test-Path $path) -or (Get-Item $path).Length -eq 0) {
              throw "Expected a non-empty preview file: $path"
            }
          }
